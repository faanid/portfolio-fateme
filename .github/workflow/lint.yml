name: Lint Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pnpm install

        run: |
          echo "🔍 Running ESLint..."
          pnpm dlx eslint . --ext .js,.ts,.jsx,.tsx
          echo "✅ ESLint passed!"

      - name: Run Prettier
        run: |
          echo "🎨 Checking Prettier formatting..."
          pnpm dlx prettier --check .
          echo "✨ Prettier OK!"
